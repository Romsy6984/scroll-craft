<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dash 955">
<title>Dash 955</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="dock" id="dock" aria-label="Navigation"></nav>
  <div class="main">
    <header class="status" id="status"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <section class="sheet__card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet__head"><h2 id="sheet-title"></h2><button class="icon-btn" data-close aria-label="Fermer">✕</button></header>
    <div class="sheet__body" id="sheet-body"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
