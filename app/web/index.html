<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dash 955">
<title>Dash 955</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell" id="shell">
  <header class="status" id="status"></header>
  <section class="carpane" id="carpane" aria-label="Ta MiTo"></section>
  <section class="mappane" aria-label="Carte">
    <div id="map"></div>
    <div class="map-top">
      <button class="search-pill" data-act="navSearch"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Où va-t-on ?</span></button>
      <div class="quick" id="quick"></div>
    </div>
    <button class="fab" id="recenter" data-act="recenter" hidden aria-label="Recentrer la carte"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg></button>
    <div class="dest" id="dest" hidden></div>
  </section>
  <nav class="bar" id="bar" aria-label="Menu"></nav>
</div>

<div class="panel" id="panel" hidden>
  <section class="panel__card" role="dialog" aria-labelledby="panel-title">
    <header class="panel__head"><h2 id="panel-title"></h2><button class="icon-btn" data-panel="home" aria-label="Fermer">✕</button></header>
    <nav class="panel__nav" id="panel-nav"></nav>
    <main class="view" id="view" tabindex="-1"></main>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <section class="sheet__card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet__head"><h2 id="sheet-title"></h2><button class="icon-btn" data-close aria-label="Fermer">✕</button></header>
    <div class="sheet__body" id="sheet-body"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
